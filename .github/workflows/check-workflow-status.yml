# This workflow checks if the given workflow name and workflow status exists and fails or continues based on the fail-if-exists flag
name: Check Workflow Status

on:
  workflow_call:
    inputs:
      workflow-name:
        type: string
        required: true
        description: "Name of the workflow to check (e.g., merge-to-dev-or-hotfix.yml)"
      workflow-status:
        type: string
        required: true
        description: "Status to check for (e.g., in_progress, queued, completed), or non-terminal for any run still going"
      created-within-minutes:
        type: number
        default: 0
        description: "Only consider runs started within this many minutes. 0 considers every run."
      fail-if-exists:
        type: boolean
        default: true
        description: "Whether to fail if matching workflows are found (true) or continue (false)"
      error-message:
        type: string
        default: "Workflow is currently running. Please retry after it completes."
        description: "Error message to display if the workflow is found"
      token:
        type: string
        description: "GitHub token to use for API requests"

jobs:
  wait-for-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow status
        uses: actions/github-script@v7
        # Inputs reach the script through the environment, keeping them out of the source.
        env:
          WORKFLOW_NAME: ${{ inputs.workflow-name }}
          WORKFLOW_STATUS: ${{ inputs.workflow-status }}
          CREATED_WITHIN_MINUTES: ${{ inputs.created-within-minutes }}
          FAIL_IF_EXISTS: ${{ inputs.fail-if-exists }}
          ERROR_MESSAGE: ${{ inputs.error-message }}
        with:
          github-token: ${{ inputs.token || github.token }}
          script: |
            const workflowName = process.env.WORKFLOW_NAME;
            const status = process.env.WORKFLOW_STATUS;
            const windowMinutes = Number(process.env.CREATED_WITHIN_MINUTES) || 0;
            const failIfExists = process.env.FAIL_IF_EXISTS === 'true';

            // A run blocked by a concurrency group reports queued or pending depending on
            // how it was triggered, so non-terminal asks for each of these in turn.
            const NON_TERMINAL = ['queued', 'in_progress', 'waiting', 'pending', 'requested'];

            // The API returns an empty list for a status it fails to recognise, which would
            // pass this guard silently. Accept only the values it documents.
            const ALLOWED = NON_TERMINAL.concat([
              'completed',
              'action_required',
              'cancelled',
              'failure',
              'neutral',
              'skipped',
              'stale',
              'success',
              'timed_out',
            ]);

            if (status !== 'non-terminal' && !ALLOWED.includes(status)) {
              core.setFailed(`Unknown workflow-status "${status}". Use non-terminal, or one of: ${ALLOWED.join(', ')}`);
              return;
            }

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowName,
              per_page: 100,
            };

            if (windowMinutes > 0) {
              params.created = `>=${new Date(Date.now() - windowMinutes * 60 * 1000).toISOString()}`;
            }

            // listWorkflowRuns scopes to workflow_id. The repo-level endpoint drops it and
            // returns runs for every workflow, dependabot included.
            // total_count covers every page, so the tally stays exact.
            let total = 0;
            const found = [];

            for (const runStatus of status === 'non-terminal' ? NON_TERMINAL : [status]) {
              let data;
              try {
                ({ data } = await github.rest.actions.listWorkflowRuns({ ...params, status: runStatus }));
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`Workflow ${workflowName} not found in ${context.repo.owner}/${context.repo.repo}`);
                  return;
                }
                throw error;
              }
              total += data.total_count;
              found.push(...data.workflow_runs.map(run => `${run.name} ${run.status} (${run.html_url})`));
            }

            if (total === 0) {
              console.log(`No ${status} runs found for ${workflowName}. Proceeding.`);
              return;
            }

            const detail = found.join('\n');

            if (failIfExists) {
              core.setFailed(`${workflowName}: ${process.env.ERROR_MESSAGE}\n${detail}`);
            } else {
              console.log(`Found ${total} ${status} run(s) for ${workflowName}. Continuing as configured.\n${detail}`);
            }
