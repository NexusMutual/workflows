# Helper workflow to validate if commits on the given ref trigger a version bump compared to the latest git tag.
name: Check Version Bump

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
        description: "Git reference to checkout"
      bump-command:
        type: string
        required: true
        description: "Command to determine if version bump is needed. Should return the type of bump or empty if not needed"
      node-version:
        type: string
        default: '22'
        description: "Node.js version to use"
    outputs:
      triggers_bump:
        description: "Whether a version bump is needed"
        value: ${{ jobs.validate.outputs.triggers_bump }}
      bump_type:
        description: "Type of bump needed (if any)"
        value: ${{ jobs.validate.outputs.bump_type }}
    secrets:
      DEPLOYER_APP_ID:
        required: true
      DEPLOYER_APP_PK:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      triggers_bump: ${{ steps.check-bump.outputs.triggers_bump }}
      bump_type: ${{ steps.check-bump.outputs.bump_type }}
    steps:
      - name: Create deployooor app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.DEPLOYER_APP_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_PK }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.ref }}
          # Needs commit history and tags determine version bump
          fetch-depth: 0
          fetch-tags: true

      # Each repository records its package manager in its lockfile.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ] && [ -f package-lock.json ]; then
            echo "::error::Both pnpm-lock.yaml and package-lock.json are present, cannot tell which package manager to use"
            exit 1
          elif [ -f pnpm-lock.yaml ]; then
            name=pnpm
            lockfile=pnpm-lock.yaml
            install="pnpm install --frozen-lockfile --ignore-scripts --prefer-offline"
          elif [ -f package-lock.json ]; then
            name=npm
            lockfile=package-lock.json
            install="npm ci --ignore-scripts --prefer-offline --no-audit --no-fund"
          else
            echo "::error::Neither pnpm-lock.yaml nor package-lock.json found"
            exit 1
          fi

          echo "Detected $name"
          {
            echo "name=$name"
            echo "lockfile=$lockfile"
            echo "install=$install"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.name }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - id: check-bump
        run: |
          echo "Running bump command to check for version changes..."
          BUMP=$(${{ inputs.bump-command }}) || true
          
          if [[ "$BUMP" =~ ^(major|minor|patch)$ ]]; then
            echo "A version bump is needed: '$BUMP'"
            echo "triggers_bump=true" >> $GITHUB_OUTPUT
            echo "bump_type=${BUMP}" >> $GITHUB_OUTPUT
          else
            echo "No version bump needed."
            echo "triggers_bump=false" >> $GITHUB_OUTPUT
          fi
