name: Determine RC Version

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
        description: "Node.js version to use"
      package-name:
        type: string
        required: true
        description: "Name of the npm package"
      bump-type:
        type: string
        required: true
        description: "Type of version bump (patch, minor, major)"
    outputs:
      rc_version:
        description: "The determined RC version"
        value: ${{ jobs.determine-rc-version.outputs.rc_version }}

jobs:
  determine-rc-version:
    runs-on: ubuntu-22.04
    outputs:
      rc_version: ${{ steps.rc_version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Each repository records its package manager in its lockfile. pnpm needs
      # --no-git-checks to version a tree with local changes; this bump stays
      # local.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ] && [ -f package-lock.json ]; then
            echo "::error::Both pnpm-lock.yaml and package-lock.json are present, cannot tell which package manager to use"
            exit 1
          elif [ -f pnpm-lock.yaml ]; then
            name=pnpm
            version="pnpm version --no-git-tag-version --no-git-checks"
          elif [ -f package-lock.json ]; then
            name=npm
            version="npm version --no-git-tag-version"
          else
            echo "::error::Neither pnpm-lock.yaml nor package-lock.json found"
            exit 1
          fi

          echo "Detected $name"
          {
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # Update package.json version locally (not committed)
      # This is needed to determine the base version for the RC
      - name: Ephemeral version bump
        run: |
          ${{ steps.pm.outputs.version }} "${{ inputs.bump-type }}"

      # Determine RC version using npm's built-in prerelease functionality
      - name: Determine RC version
        id: rc_version
        run: |
          # Get the current base version after the bump
          base_version="$(jq -r .version package.json)"
          echo "Base version: $base_version"
          
          # Check if there are existing RC versions for this base version
          # Updated regex to match the new format with dot separator (e.g., 2.12.1-rc.0)
          latest_rc=$(npm view "${{ inputs.package-name }}" versions --json 2>/dev/null | jq -r '.[]' 2>/dev/null | grep "^$base_version-rc\.[0-9]\+$" | sort -V | tail -n 1 || echo "")
          echo "Latest RC: $latest_rc"
          
          if [ -z "$latest_rc" ]; then
            # No existing RC for this base version - create the first one
            ${{ steps.pm.outputs.version }} "$base_version-rc.0"
          else
            # Existing RC found - set the version to match it then increment
            ${{ steps.pm.outputs.version }} "$latest_rc"
            ${{ steps.pm.outputs.version }} prerelease --preid=rc
          fi
          
          rc_version="$(jq -r .version package.json)"
          
          echo "RC version: $rc_version"
          echo "value=$rc_version" >> $GITHUB_OUTPUT
