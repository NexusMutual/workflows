name: Bump version

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
      bump-command:
        type: string
        default: "echo Meep meep no bump command && exit 1"
      node-version:
        type: string
        default: '22'
    secrets:
      DEPLOYER_APP_ID:
        required: true
      DEPLOYER_APP_PK:
        required: true
    outputs:
      bumped_version:
        description: "The version after bumping"
        value: ${{ jobs.bump.outputs.bumped_version }}

jobs:
  bump:
    runs-on: ubuntu-22.04
    environment: ${{ inputs.environment }}
    outputs:
      bumped_version: ${{ steps.get-version.outputs.bumped_version }}
    steps:
      - name: Create deployooor app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.DEPLOYER_APP_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_PK }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      # Each repository records its package manager in its lockfile.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ] && [ -f package-lock.json ]; then
            echo "::error::Both pnpm-lock.yaml and package-lock.json are present, cannot tell which package manager to use"
            exit 1
          elif [ -f pnpm-lock.yaml ]; then
            name=pnpm
            lockfile=pnpm-lock.yaml
            install="pnpm install --frozen-lockfile --ignore-scripts --prefer-offline"
          elif [ -f package-lock.json ]; then
            name=npm
            lockfile=package-lock.json
            install="npm ci --ignore-scripts --prefer-offline --no-audit --no-fund"
          else
            echo "::error::Neither pnpm-lock.yaml nor package-lock.json found"
            exit 1
          fi

          echo "Detected $name"
          {
            echo "name=$name"
            echo "lockfile=$lockfile"
            echo "install=$install"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.name }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Bump version
        run: ${{ inputs.bump-command }}

      - name: Get bumped version
        id: get-version
        run: echo "bumped_version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Commit and push
        env:
          LOCKFILE: ${{ steps.pm.outputs.lockfile }}
        run: |
          git config --local user.email "deployooor@nexusmutual.io"
          git config --local user.name "Version bumpooor"

          # check if there are changes to commit
          # Globs stay quoted so git matches them recursively, as git ls-files does below.
          if [[ -z "$(git status --porcelain package.json "$LOCKFILE" "**/package.json" "**/$LOCKFILE")" ]]; then
            echo "No changes to commit. Failing bump job."
            exit 1
          fi

          git add package.json "$LOCKFILE" $(git ls-files "**/package.json" "**/$LOCKFILE")
          git commit -m "chore(release): v${{ steps.get-version.outputs.bumped_version }} [skip ci]"
          git push origin ${{ inputs.ref }}
